<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latein Lernecke - VocLatin</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            latin: {
              50: '#fdf8f6',
              100: '#f2e8e5',
              500: '#c2410c',
              600: '#ea580c',
              700: '#9a3412',
              900: '#431407'
            }
          }
        }
      }
    }
  </script>

  <!-- iPad Safari Spezial-CSS -->
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
    }
    button, .interactive {
      cursor: pointer !important;
      touch-action: manipulation;
    }
    .perspective-1000 {
      perspective: 1000px;
      -webkit-perspective: 1000px;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
    }
    .card-inner.is-flipped {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 1rem;
    }
    .card-back {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }
  </style>
</head>
<body class="h-full bg-latin-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex flex-col justify-between font-sans selection:bg-latin-500 selection:text-white">

  <!-- Header / Kopfzeile -->
  <header class="w-full max-w-2xl mx-auto p-4 flex justify-between items-center border-b border-latin-100 dark:border-slate-800">
    <div class="flex items-center space-x-2">
      <span class="text-2xl">🏛️</span>
      <h1 class="text-xl font-bold tracking-tight text-latin-900 dark:text-latin-100">VocLatin</h1>
    </div>
    <div class="flex items-center space-x-2">
      <button id="themeToggleBtn" type="button" class="interactive p-2.5 rounded-xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700">
        <span id="themeIcon">🌙</span>
      </button>
      <button id="settingsBtn" type="button" class="interactive p-2.5 rounded-xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700">
        ⚙️
      </button>
    </div>
  </header>

  <!-- Hauptbereich -->
  <main class="w-full max-w-md mx-auto px-4 py-6 flex-1 flex flex-col justify-center items-center">
    
    <!-- Lektions-Anzeige -->
    <div class="w-full flex justify-between items-center mb-4 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
      <span id="lessonInfo">Lektion 1</span>
      <span id="progressText">Karte 1 von 5</span>
    </div>

    <!-- Karteikarte -->
    <div id="cardContainer" class="perspective-1000 w-full h-80 my-2 select-none">
      <button id="flashcard" type="button" class="interactive card-inner w-full h-full text-left focus:outline-none">
        
        <!-- Vorderseite -->
        <div class="card-face bg-white dark:bg-slate-800 border-2 border-latin-500/20 dark:border-latin-500/40 shadow-xl p-8 text-center">
          <span class="text-xs font-semibold uppercase text-latin-600 dark:text-latin-500 tracking-wider mb-2">Latein</span>
          <h2 id="latinWord" class="text-4xl font-extrabold text-slate-900 dark:text-white my-auto">servus</h2>
          <p id="grammarInfo" class="text-sm text-slate-500 dark:text-slate-400 mt-2">m. (O-Deklination)</p>
          <span class="text-xs text-slate-400 dark:text-slate-500 mt-4">Tippen zum Umdrehen 🔄</span>
        </div>

        <!-- Rückseite -->
        <div class="card-face card-back bg-latin-600 text-white shadow-xl p-8 text-center">
          <span class="text-xs font-semibold uppercase text-latin-100/80 tracking-wider mb-2">Deutsch</span>
          <h2 id="germanWord" class="text-3xl font-bold my-auto">Sklave, Knecht</h2>
          <p id="exampleInfo" class="text-sm text-latin-100/90 mt-2">Substantiv</p>
          <span class="text-xs text-latin-100/70 mt-4">Tippen zum Zurückdrehen 🔄</span>
        </div>

      </button>
    </div>

    <!-- Navigations-Knöpfe -->
    <div class="w-full flex items-center justify-between gap-3 mt-6">
      <button id="prevBtn" type="button" class="interactive flex-1 py-3 px-4 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm text-slate-700 dark:text-slate-200 font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 active:scale-95 transition-all text-center">
        ← Zurück
      </button>
      <button id="flipBtn" type="button" class="interactive flex-1 py-3 px-4 rounded-xl bg-latin-600 hover:bg-latin-700 text-white font-bold shadow-md active:scale-95 transition-all text-center">
        Umdrehen
      </button>
      <button id="nextBtn" type="button" class="interactive flex-1 py-3 px-4 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm text-slate-700 dark:text-slate-200 font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 active:scale-95 transition-all text-center">
        Weiter →
      </button>
    </div>

  </main>

  <!-- Fußzeile -->
  <footer class="w-full max-w-2xl mx-auto p-4 text-center text-xs text-slate-400 border-t border-latin-100 dark:border-slate-800">
    VocLatin &bull; Latein Vokabeltrainer
  </footer>

  <!-- Einstellungs-Fenster (Vollständig versteckt, wenn nicht aktiv) -->
  <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700">
      <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-4">Einstellungen</h3>
      <p class="text-sm text-slate-600 dark:text-slate-300 mb-6">Hier kannst du deine Lerneinstellungen anpassen.</p>
      <button id="closeSettingsBtn" type="button" class="interactive w-full py-2.5 bg-latin-600 text-white font-semibold rounded-xl hover:bg-latin-700">
        Schließen
      </button>
    </div>
  </div>

  <!-- JavaScript Logik -->
  <script>
    // Vokabel-Datenbank
    const vocabulary = [
      { latin: "servus", german: "Sklave, Knecht", grammar: "m. (O-Deklination)", lesson: "Lektion 1" },
      { latin: "amica", german: "Freundin", grammar: "f. (A-Deklination)", lesson: "Lektion 1" },
      { latin: "domina", german: "Herrin", grammar: "f. (A-Deklination)", lesson: "Lektion 1" },
      { latin: "vocare", german: "rufen, nennen", grammar: "v. (A-Konjugation)", lesson: "Lektion 1" },
      { latin: "magnus", german: "groß, bedeutend", grammar: "adj. (a/o)", lesson: "Lektion 1" }
    ];

    let currentIndex = 0;
    let isFlipped = false;

    // Elemente laden
    const flashcard = document.getElementById('flashcard');
    const latinWord = document.getElementById('latinWord');
    const germanWord = document.getElementById('germanWord');
    const grammarInfo = document.getElementById('grammarInfo');
    const lessonInfo = document.getElementById('lessonInfo');
    const progressText = document.getElementById('progressText');
    
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const flipBtn = document.getElementById('flipBtn');
    
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');

    // Karte aktualisieren
    function updateCard() {
      const item = vocabulary[currentIndex];
      latinWord.textContent = item.latin;
      germanWord.textContent = item.german;
      grammarInfo.textContent = item.grammar;
      lessonInfo.textContent = item.lesson;
      progressText.textContent = `Karte ${currentIndex + 1} von ${vocabulary.length}`;

      isFlipped = false;
      flashcard.classList.remove('is-flipped');
    }

    // Karte umdrehen
    function toggleFlip(e) {
      if (e) e.preventDefault();
      isFlipped = !isFlipped;
      flashcard.classList.toggle('is-flipped', isFlipped);
    }

    // Event Listener
    flashcard.addEventListener('click', toggleFlip);
    flipBtn.addEventListener('click', toggleFlip);

    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + vocabulary.length) % vocabulary.length;
      updateCard();
    });

    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % vocabulary.length;
      updateCard();
    });

    // Dark Mode
    themeToggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
    });

    // Einstellungen-Modal
    settingsBtn.addEventListener('click', () => {
      settingsModal.classList.remove('hidden');
    });

    closeSettingsBtn.addEventListener('click', () => {
      settingsModal.classList.add('hidden');
    });

    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) {
        settingsModal.classList.add('hidden');
      }
    });

    // iPad Touch-Events aktivieren
    document.addEventListener("touchstart", function() {}, {passive: true});

    // Start
    updateCard();
  </script>
</body>
</html>

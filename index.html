<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VocLatin - Latein Vokabeltrainer</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            latin: {
              50: '#fdf8f6',
              100: '#f2e8e5',
              500: '#c2410c',
              600: '#ea580c',
              700: '#9a3412',
              900: '#431407'
            }
          }
        }
      }
    }
  </script>

  <!-- iPad Safari Spezial-CSS & Layout-Schutz -->
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
    }
    button, .interactive {
      cursor: pointer !important;
      touch-action: manipulation;
    }
    /* Verhindert, dass Innenelemente von Karten Klicks verschlucken */
    .card-face * {
      pointer-events: none;
    }
    .perspective-1000 {
      perspective: 1000px;
      -webkit-perspective: 1000px;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
    }
    .card-inner.is-flipped {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 1rem;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card-back {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }
  </style>
</head>
<body class="h-full bg-latin-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex flex-col justify-between font-sans overflow-x-hidden">

  <!-- Header -->
  <header class="w-full max-w-2xl mx-auto p-4 flex justify-between items-center border-b border-latin-100 dark:border-slate-800">
    <div class="flex items-center space-x-2">
      <span class="text-2xl">🏛️</span>
      <h1 class="text-xl font-bold tracking-tight text-latin-900 dark:text-latin-100">VocLatin</h1>
    </div>
    <div class="flex items-center space-x-2">
      <button id="themeToggleBtn" type="button" class="interactive p-2.5 rounded-xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300">
        <span id="themeIcon">🌙</span>
      </button>
      <button id="settingsBtn" type="button" class="interactive p-2.5 rounded-xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300">
        ⚙️
      </button>
    </div>
  </header>

  <!-- Hauptbereich -->
  <main class="w-full max-w-md mx-auto px-4 py-4 flex-1 flex flex-col justify-between items-center">
    
    <!-- Lektionsauswahl & Statistik -->
    <div class="w-full flex justify-between items-center mb-2">
      <select id="lessonSelect" class="interactive bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-semibold rounded-lg px-3 py-1.5 text-slate-700 dark:text-slate-200">
        <option value="all">Alle Lektionen</option>
        <option value="Lektion 1">Lektion 1</option>
        <option value="Lektion 2">Lektion 2</option>
      </select>
      
      <div class="text-xs font-semibold text-slate-500 dark:text-slate-400 flex gap-2">
        <span class="text-green-600 font-bold" id="scoreCorrect">Richtig: 0</span>
        <span>|</span>
        <span class="text-red-500 font-bold" id="scoreWrong">Falsch: 0</span>
      </div>
    </div>

    <!-- Fortschritts-Anzeige -->
    <div class="w-full flex justify-between items-center mb-3 text-xs font-semibold text-slate-400">
      <span id="lessonInfo">Lektion 1</span>
      <span id="progressText">Karte 1 von 1</span>
    </div>

    <!-- Karteikarte (Kompakte Höhe gegen Überlappung) -->
    <div id="cardContainer" class="perspective-1000 w-full h-64 my-auto select-none">
      <button id="flashcard" type="button" class="interactive card-inner w-full h-full text-left focus:outline-none">
        
        <!-- Vorderseite (Latein & Grammatik) -->
        <div class="card-face bg-white dark:bg-slate-800 border-2 border-latin-500/30 dark:border-latin-500/40 shadow-lg">
          <span class="text-xs font-semibold uppercase text-latin-600 dark:text-latin-500 tracking-wider mb-2" id="cardCategory">Latein</span>
          <h2 id="latinWord" class="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white text-center my-auto">vocare</h2>
          <div class="text-center mt-2">
            <p id="grammarInfo" class="text-sm font-medium text-latin-700 dark:text-latin-500">v., A-Konjugation</p>
            <p id="extraForms" class="text-xs text-slate-500 dark:text-slate-400 mt-1">voco, vocavi, vocatum</p>
          </div>
          <span class="text-xs text-slate-400 dark:text-slate-500 mt-4">Tippen zum Umdrehen 🔄</span>
        </div>

        <!-- Rückseite (Deutsch) -->
        <div class="card-face card-back bg-latin-600 text-white shadow-lg">
          <span class="text-xs font-semibold uppercase text-latin-100/80 tracking-wider mb-2">Bedeutung</span>
          <h2 id="germanWord" class="text-2xl sm:text-3xl font-bold text-center my-auto">rufen, nennen</h2>
          <p id="exampleInfo" class="text-xs text-latin-100/80 mt-2">Beispiel: Vocat me. (Er ruft mich.)</p>
          <span class="text-xs text-latin-100/70 mt-4">Tippen zum Zurückdrehen 🔄</span>
        </div>

      </button>
    </div>

    <!-- Bewertungsknöpfe (Gewusst / Nicht gewusst) -->
    <div class="w-full grid grid-cols-2 gap-3 mt-4 mb-3">
      <button id="wrongBtn" type="button" class="interactive py-3 px-4 rounded-xl bg-red-100 hover:bg-red-200 dark:bg-red-950/50 dark:hover:bg-red-900/60 text-red-700 dark:text-red-300 font-bold shadow-sm active:scale-95 transition-all flex items-center justify-center gap-2">
        ❌ Nicht gewusst
      </button>
      <button id="correctBtn" type="button" class="interactive py-3 px-4 rounded-xl bg-emerald-100 hover:bg-emerald-200 dark:bg-emerald-950/50 dark:hover:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300 font-bold shadow-sm active:scale-95 transition-all flex items-center justify-center gap-2">
        ✅ Gewusst
      </button>
    </div>

    <!-- Navigation (Zurück / Weiter) -->
    <div class="w-full flex items-center justify-between gap-3 mb-2">
      <button id="prevBtn" type="button" class="interactive flex-1 py-2.5 px-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm text-slate-700 dark:text-slate-200 font-semibold text-sm active:scale-95 text-center">
        ← Zurück
      </button>
      <button id="nextBtn" type="button" class="interactive flex-1 py-2.5 px-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm text-slate-700 dark:text-slate-200 font-semibold text-sm active:scale-95 text-center">
        Weiter →
      </button>
    </div>

  </main>

  <!-- Fußzeile -->
  <footer class="w-full max-w-2xl mx-auto p-3 text-center text-xs text-slate-400 border-t border-latin-100 dark:border-slate-800">
    VocLatin &bull; Latein Vokabeltrainer
  </footer>

  <!-- Einstellungs-Modal -->
  <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700">
      <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-4">Einstellungen</h3>
      <p class="text-sm text-slate-600 dark:text-slate-300 mb-6">Hier kannst du Einstellungen anpassen.</p>
      <button id="closeSettingsBtn" type="button" class="interactive w-full py-2.5 bg-latin-600 text-white font-semibold rounded-xl hover:bg-latin-700">
        Schließen
      </button>
    </div>
  </div>

  <!-- JavaScript Logik -->
  <script>
    // DEINE VOKABEL-DATENBANK (Hier kannst du deine Buch-Vokabeln beliebig erweitern)
    const vocabularyDatabase = [
      { 
        latin: "vocare", 
        german: "rufen, nennen", 
        grammar: "v., A-Konjugation", 
        forms: "voco, vocavi, vocatum",
        example: "Vocat me. (Er ruft mich.)",
        lesson: "Lektion 1" 
      },
      { 
        latin: "servus", 
        german: "Sklave, Knecht", 
        grammar: "m., O-Deklination", 
        forms: "servi m.",
        example: "Servus laborat. (Der Sklave arbeitet.)",
        lesson: "Lektion 1" 
      },
      { 
        latin: "amica", 
        german: "Freundin", 
        grammar: "f., A-Deklination", 
        forms: "amicae f.",
        example: "Amica venit. (Die Freundin kommt.)",
        lesson: "Lektion 1" 
      },
      { 
        latin: "magnus", 
        german: "groß, bedeutend", 
        grammar: "adj., a/o-Deklination", 
        forms: "magnus, magna, magnum",
        example: "magna villa (ein großes Landhaus)",
        lesson: "Lektion 2" 
      }
    ];

    let currentList = [...vocabularyDatabase];
    let currentIndex = 0;
    let isFlipped = false;
    let correctCount = 0;
    let wrongCount = 0;

    // Elemente
    const flashcard = document.getElementById('flashcard');
    const latinWord = document.getElementById('latinWord');
    const germanWord = document.getElementById('germanWord');
    const grammarInfo = document.getElementById('grammarInfo');
    const extraForms = document.getElementById('extraForms');
    const exampleInfo = document.getElementById('exampleInfo');
    const lessonInfo = document.getElementById('lessonInfo');
    const progressText = document.getElementById('progressText');
    const lessonSelect = document.getElementById('lessonSelect');
    
    const scoreCorrect = document.getElementById('scoreCorrect');
    const scoreWrong = document.getElementById('scoreWrong');

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const correctBtn = document.getElementById('correctBtn');
    const wrongBtn = document.getElementById('wrongBtn');
    
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');

    // Karte aktualisieren
    function updateCard() {
      if (currentList.length === 0) return;
      const item = currentList[currentIndex];
      
      latinWord.textContent = item.latin;
      germanWord.textContent = item.german;
      grammarInfo.textContent = item.grammar || '';
      extraForms.textContent = item.forms || '';
      exampleInfo.textContent = item.example ? `Beispiel: ${item.example}` : '';
      lessonInfo.textContent = item.lesson;
      progressText.textContent = `Karte ${currentIndex + 1} von ${currentList.length}`;

      isFlipped = false;
      flashcard.classList.remove('is-flipped');
    }

    // Karte umdrehen
    function toggleFlip(e) {
      if (e) e.preventDefault();
      isFlipped = !isFlipped;
      flashcard.classList.toggle('is-flipped', isFlipped);
    }

    // Bewertung verarbeiten
    function markAnswer(isCorrect) {
      if (isCorrect) {
        correctCount++;
        scoreCorrect.textContent = `Richtig: ${correctCount}`;
      } else {
        wrongCount++;
        scoreWrong.textContent = `Falsch: ${wrongCount}`;
      }
      // Zur nächsten Karte springen
      currentIndex = (currentIndex + 1) % currentList.length;
      updateCard();
    }

    // Lektion filtern
    lessonSelect.addEventListener('change', (e) => {
      const selected = e.target.value;
      if (selected === 'all') {
        currentList = [...vocabularyDatabase];
      } else {
        currentList = vocabularyDatabase.filter(item => item.lesson === selected);
      }
      currentIndex = 0;
      updateCard();
    });

    // Event Listener
    flashcard.addEventListener('click', toggleFlip);
    correctBtn.addEventListener('click', () => markAnswer(true));
    wrongBtn.addEventListener('click', () => markAnswer(false));

    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
      updateCard();
    });

    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % currentList.length;
      updateCard();
    });

    // Dark Mode
    themeToggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
    });

    // Einstellungen-Modal
    settingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
    closeSettingsBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));

    // iPad Safari Touch-Fixes
    document.addEventListener("touchstart", function() {}, {passive: true});

    // Start
    updateCard();
  </script>
</body>
</html>
